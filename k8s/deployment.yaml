apiVersion: apps/v1
kind: Deployment
metadata: { name: scoreboard, namespace: scoreboard }
spec:
  replicas: 1
  selector: { matchLabels: { app: scoreboard } }
  template:
    metadata: { labels: { app: scoreboard } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
      - name: app
        image: ghcr.io/hbaslimane/devops-project:ea50d89e1d9ce4fedffb1a9a12a97acec92331b2
        ports: [{ name: http, containerPort: 8000 }]
        env:
        - { name: DATABASE_URL, value: "sqlite:////data/scoreboard.db" }
        - name: ADMIN_TOKEN
          valueFrom: { secretKeyRef: { name: scoreboard-admin, key: token } }
        startupProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: tmp, mountPath: /tmp }
      volumes:
      - { name: data, emptyDir: {} }
      - { name: tmp, emptyDir: {} }
